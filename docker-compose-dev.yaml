      - server
    volumes:
      - ./client/config.yaml:/config.yaml
      - ./data/dataset/agency-3.csv:/agency.csv
  client4:
    container_name: client4
    image: client:latest
    entrypoint: /client
    environment:
      - CLI_ID=4
      - NOMBRE=Ana
      - APELLIDO=Perez
