  client4:
    container_name: client4
    image: client:latest
    entrypoint: /client
    environment:
      - CLI_ID=4
      - NOMBRE=Santiago
      - APELLIDO=Lorca
      - DOCUMENTO=40737239
      - NACIMIENTO=1970-11-24
      - NUMERO=8627
    networks:
      - testing_net
    depends_on:
      - server
    volumes:
      - ./client/config.yaml:/config.yaml
      - ./.data/agency-4.csv:/agency.csv
  client5:
