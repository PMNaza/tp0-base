name: tp0
services:
  server:
    container_name: server
    image: server:latest
    entrypoint: python3 /main.py
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - testing_net
    volumes:
      - ./server/config.ini:/config.ini
  client1:
    container_name: client1
    image: client:latest
    entrypoint: /client
    environment:
      - CLI_ID=1
      - NOMBRE=Maria
      - APELLIDO=Lorca
      - DOCUMENTO=21106740
      - NACIMIENTO=1984-05-15
      - NUMERO=9120
    networks:
      - testing_net
    depends_on:
      - server
    volumes:
      - ./client/config.yaml:/config.yaml
      - ./data/dataset/agency-1.csv:/agency.csv
  client2:
    container_name: client2
    image: client:latest
    entrypoint: /client
    environment:
      - CLI_ID=2
      - NOMBRE=Santiago
      - APELLIDO=Gomez
      - DOCUMENTO=40258866
      - NACIMIENTO=1989-10-21
      - NUMERO=7465
