name: tp0
services:
  server:
    container_name: server
    image: server:latest
    entrypoint: python3 /main.py
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - testing_net
    volumes:
      - ./server/config.ini:/config.ini
  client1:
    container_name: client1
    image: client:latest
    entrypoint: /client
    environment:
      - CLI_ID=1
      - NOMBRE=Lionel
      - APELLIDO=Fernandez
      - DOCUMENTO=35100514
      - NACIMIENTO=1976-09-14
      - NUMERO=6566
    networks:
      - testing_net
    depends_on:
      - server
    volumes:
      - ./client/config.yaml:/config.yaml
      - ./.data/agency-1.csv:/agency.csv
  client2:
    container_name: client2
    image: client:latest
    entrypoint: /client
    environment:
      - CLI_ID=2
      - NOMBRE=Maria
      - APELLIDO=Diaz
      - DOCUMENTO=37258650
      - NACIMIENTO=1976-06-22
      - NUMERO=6477
