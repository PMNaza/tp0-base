      - ./client/config.yaml:/config.yaml
      - ./.data/agency-3.csv:/agency.csv
  client4:
    container_name: client4
    image: client:latest
    entrypoint: /client
    environment:
      - CLI_ID=4
      - NOMBRE=Santiago
      - APELLIDO=Perez
      - DOCUMENTO=25100605
      - NACIMIENTO=1994-05-06
      - NUMERO=7311
    networks:
      - testing_net
    depends_on:
      - server
    volumes:
      - ./client/config.yaml:/config.yaml
      - ./.data/agency-4.csv:/agency.csv
  client5:
    container_name: client5
